<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bon de Commande Partenariat Noël 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <header class="hero">
            <span class="eyebrow">Partenariat Noël 2026</span>
            <h1>Bon de commande</h1>
            <p>Saisissez les informations puis les quantités de chaque article.</p>
        </header>

        <form id="order-form">
            <section class="card">
                <h2>Informations</h2>
                <div class="grid-2">
                    <div class="field">
                        <label for="reseller-class">Niveau du revendeur</label>
                        <select id="reseller-class" name="reseller-class" required>
                            <option value="">Choisir…</option>
                            <option value="6">6e</option>
                            <option value="5">5e</option>
                            <option value="4">4e</option>
                            <option value="3">3e</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="class-number">Numéro de classe</label>
                        <select id="class-number" name="class-number" required>
                            <option value="">Choisir…</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="vendor_name">Nom Prénom du vendeur</label>
                        <select id="vendor-select" hidden></select>
                        <input type="text" id="vendor_name" name="vendor_name" autocomplete="off" required>
                    </div>
                    <div class="field">
                        <label for="client_name">Nom Prénom du client</label>
                        <input type="text" id="client_name" name="client_name" autocomplete="off" required>
                    </div>
                </div>
            </section>

            <div id="catalogue"></div>

            <section class="card">
                <h2>Paiement</h2>
                <div class="segmented">
                    <label><input type="radio" name="payment-method" value="cash" checked><span>Espèces</span></label>
                    <label><input type="radio" name="payment-method" value="cheque"><span>Chèque</span></label>
                </div>
                <div id="cheque-number-container" class="field" style="display: none; margin: 14px 0 0;">
                    <label for="cheque-number">Numéro de chèque</label>
                    <input type="text" id="cheque-number" name="cheque-number" inputmode="numeric" placeholder="Ex. 1234567">
                </div>
            </section>

            <div class="checkout">
                <div class="checkout-info">
                    <div class="checkout-count" id="total-produits">0 article</div>
                    <div class="checkout-total" id="total-commande">0,00 €</div>
                </div>
                <button type="submit" class="btn btn-lg">Valider</button>
            </div>
        </form>

        <footer class="footer">
            <a href="admin.html">Administration</a><br>
            Tous droits réservés ALRIC Gaël
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="produits.js"></script>
    <script src="eleves.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('order-form');
        const euros = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });

        // Génère les sections de produits à partir du catalogue (produits.js)
        const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        document.getElementById('catalogue').innerHTML = CATALOGUE.map(({ categorie, produits }) => `
            <section class="card category">
                <h2>${escapeHtml(categorie)}</h2>
                ${produits.map(p => `
                <div class="product">
                    <div class="product-info">
                        <div class="product-name">${escapeHtml(p.nom)}${p.nouveau ? ' <span class="badge">Nouveau</span>' : ''}</div>
                        <div class="product-meta">${escapeHtml(p.boitage)} · ${p.poids} · ${euros.format(p.prix)}</div>
                    </div>
                    <div class="stepper"><button type="button" data-step="-1" aria-label="Retirer">−</button><input type="number" class="quantity" data-col="${p.code}" data-price="${p.prix}" min="0" value="0" inputmode="numeric" aria-label="Quantité ${escapeHtml(p.nom)}"><button type="button" data-step="1" aria-label="Ajouter">+</button></div>
                    <div class="product-total">${euros.format(0)}</div>
                </div>`).join('')}
            </section>`).join('');

        const quantities = form.querySelectorAll('.quantity');
        const totalProduitsElement = document.getElementById('total-produits');
        const totalCommandeElement = document.getElementById('total-commande');
        const chequeNumberContainer = document.getElementById('cheque-number-container');
        const chequeNumberInput = document.getElementById('cheque-number');
        let totalprix = 0;

        const resellerClassSelect = document.getElementById('reseller-class');
        const classNumberSelect = document.getElementById('class-number');
        const vendorSelect = document.getElementById('vendor-select');
        const vendorInput = document.getElementById('vendor_name');
        const AUTRE = '__autre__';

        // Si la liste des élèves de la classe est connue, le vendeur se choisit dans une liste
        function refreshVendorField() {
            const eleves = (typeof ELEVES !== 'undefined' && ELEVES[resellerClassSelect.value + classNumberSelect.value]) || null;
            const previous = vendorInput.value;

            if (!eleves) {
                vendorSelect.hidden = true;
                vendorSelect.required = false;
                vendorInput.hidden = false;
                return;
            }

            vendorSelect.innerHTML = '';
            vendorSelect.add(new Option('Choisir un élève…', ''));
            eleves.forEach(nom => vendorSelect.add(new Option(nom, nom.toUpperCase())));
            vendorSelect.add(new Option('Autre (saisir le nom)…', AUTRE));

            vendorSelect.value = eleves.some(nom => nom.toUpperCase() === previous.toUpperCase()) ? previous.toUpperCase() : '';
            if (vendorSelect.value === '') vendorInput.value = '';
            vendorSelect.hidden = false;
            vendorSelect.required = true;
            vendorInput.hidden = true;
        }

        vendorSelect.addEventListener('change', () => {
            const autre = vendorSelect.value === AUTRE;
            vendorInput.hidden = !autre;
            vendorInput.value = autre ? '' : vendorSelect.value;
            if (autre) vendorInput.focus();
        });

        resellerClassSelect.addEventListener('change', refreshVendorField);
        classNumberSelect.addEventListener('change', refreshVendorField);

        const getPaymentMethod = () => form.querySelector('input[name="payment-method"]:checked').value;

        // Met à jour les totaux par ligne et le total général
        function updateTotals() {
            let totalProduits = 0;
            let totalCommande = 0;

            quantities.forEach(quantity => {
                const price = parseFloat(quantity.dataset.price);
                const qty = parseInt(quantity.value) || 0;

                totalProduits += qty;
                totalCommande += qty * price;

                const row = quantity.closest('.product');
                row.querySelector('.product-total').textContent = euros.format(qty * price);
                row.classList.toggle('has-qty', qty > 0);
            });

            totalprix = Math.round(totalCommande * 100) / 100;
            totalProduitsElement.textContent = totalProduits + (totalProduits > 1 ? ' articles' : ' article');
            totalCommandeElement.textContent = euros.format(totalprix);
        }

        // Affiche le champ numéro de chèque uniquement pour un paiement par chèque
        function toggleChequeNumber() {
            const isCheque = getPaymentMethod() === 'cheque';
            chequeNumberContainer.style.display = isCheque ? 'block' : 'none';
            chequeNumberInput.required = isCheque;
        }

        // Boutons − / +
        form.addEventListener('click', event => {
            const button = event.target.closest('[data-step]');
            if (!button) return;
            const input = button.parentElement.querySelector('.quantity');
            input.value = Math.max(0, (parseInt(input.value) || 0) + Number(button.dataset.step));
            updateTotals();
        });

        quantities.forEach(quantity => quantity.addEventListener('input', updateTotals));
        form.querySelectorAll('input[name="payment-method"]').forEach(radio => radio.addEventListener('change', toggleChequeNumber));

        updateTotals();
        toggleChequeNumber();
        refreshVendorField();

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const vendorName = document.getElementById('vendor_name').value.toUpperCase();
            const clientName = document.getElementById('client_name').value.toUpperCase();
            const paymentMethod = getPaymentMethod();
            const Niveau = document.getElementById('reseller-class').value;
            const classe = document.getElementById('class-number').value;
            const orderid = Niveau + classe;
            const chequeNumber = paymentMethod === 'cheque' ? chequeNumberInput.value : null;
            const totalAmount = totalprix;

            const userConfirmed = confirm(`Le montant total est de ${euros.format(totalAmount)}. Voulez-vous continuer ?`);
            if (!userConfirmed) return;

            const orderData = {
                order_id: orderid,
                vendor_name: vendorName,
                client_name: clientName,
                payment_method: paymentMethod,
                cheque_number: chequeNumber,
                total_amount: totalAmount,
            };
            quantities.forEach(quantity => {
                orderData[quantity.dataset.col + '_quantity'] = parseInt(quantity.value) || 0;
            });

            const { createClient } = supabase;
            const _supabase = createClient('https://pjbhjhjmcxyiapzlqdpo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqYmhqaGptY3h5aWFwemxxZHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA0NjY3MzUsImV4cCI6MjA0NjA0MjczNX0.p1nDmQ2mIpJRVZAaZIOT0db4MQZJV6V0TRILpoJ3UOs');

            const { error } = await _supabase
                .from('BDCElhuyar')
                .insert([orderData]);

            if (error) {
                console.error('Erreur lors de l\'insertion:', error);
                alert('Erreur lors de l\'enregistrement des données.');
                return;
            }

            alert('Données enregistrées avec succès !');

            const keepVendorInfo = confirm("Souhaitez-vous garder le nom du vendeur et sa classe ?");
            form.reset();
            if (keepVendorInfo) {
                document.getElementById('vendor_name').value = vendorName;
                document.getElementById('reseller-class').value = Niveau;
                document.getElementById('class-number').value = classe;
            }
            refreshVendorField();
            updateTotals();
            toggleChequeNumber();
            window.scrollTo(0, 0);
        });
    });
    </script>
</body>
</html>
