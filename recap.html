<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récapitulatif des Totaux des Produits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a href="admin.html" class="btn">← Retour</a>
        <h1>Totaux par produit</h1>
        <button type="button" class="btn" id="export">⤓ Excel</button>
        <button type="button" class="btn" onclick="location.reload();">↻ Rafraîchir</button>
    </header>

    <main class="page page-wide">
        <div class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Produit</th>
                        <th class="amount">Quantité totale</th>
                        <th class="amount">Montant</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <!-- Les données seront insérées ici par JavaScript -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2">Total</td>
                        <td class="amount" id="totalQty">0</td>
                        <td class="amount" id="totalAmount">0,00 €</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="produits.js"></script>
    <script src="commun.js"></script>
    <script>
        async function loadData() {
            const data = await chargerCommandes();
            if (!data) return;

            // Quantité totale de chaque produit du catalogue
            const ordersBody = document.getElementById("ordersBody");
            const totaux = PRODUITS.map(p => ({ produit: p, qty: data.reduce((sum, item) => sum + quantite(item, p), 0) }));
            totaux.forEach(({ produit, qty }) => {
                const row = document.createElement("tr");
                row.innerHTML = `<td></td><td></td><td class="amount">${qty}</td><td class="amount">${formatEuros(qty * produit.prix)}</td>`;
                row.cells[0].textContent = produit.code;
                row.cells[1].textContent = produit.nom;
                ordersBody.appendChild(row);
            });

            const totalQty = totaux.reduce((sum, t) => sum + t.qty, 0);
            const totalAmount = data.reduce((sum, item) => sum + (Number(item.total_amount) || 0), 0);
            document.getElementById("totalQty").textContent = totalQty;
            document.getElementById("totalAmount").textContent = formatEuros(totalAmount);

            // Export : la liste à transmettre au chocolatier
            document.getElementById("export").onclick = () => telechargerCsv(`totaux-produits-${new Date().toISOString().slice(0, 10)}.csv`, [
                ["Catégorie", "Code", "Produit", "Boîtage", "Poids", "Prix unitaire", "Quantité", "Montant"],
                ...CATALOGUE.flatMap(c => c.produits.map(p => {
                    const qty = totaux.find(t => t.produit === p).qty;
                    return [c.categorie, p.code, p.nom, p.boitage, p.poids, p.prix, qty, Math.round(qty * p.prix * 100) / 100];
                })),
                ["", "", "Total", "", "", "", totalQty, Math.round(totalAmount * 100) / 100],
            ]);
        }

        loadData();
    </script>
</body>
</html>
