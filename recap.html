<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récapitulatif des Totaux des Produits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a href="admin.html" class="btn">← Retour</a>
        <h1>Récapitulatif des Totaux des Produits</h1>
        <button type="button" class="btn" onclick="location.reload();">↻ Rafraîchir</button>
    </header>

    <main class="page page-wide">
        <div class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Produit</th>
                        <th class="amount">Quantité totale</th>
                        <th class="amount">Montant</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <!-- Les données seront insérées ici par JavaScript -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2">Total</td>
                        <td class="amount" id="totalQty">0</td>
                        <td class="amount" id="totalAmount">0,00 €</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="produits.js"></script>
    <script>
        const { createClient } = supabase
        const _supabase = createClient('https://pjbhjhjmcxyiapzlqdpo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqYmhqaGptY3h5aWFwemxxZHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA0NjY3MzUsImV4cCI6MjA0NjA0MjczNX0.p1nDmQ2mIpJRVZAaZIOT0db4MQZJV6V0TRILpoJ3UOs')
        const euros = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });

        async function loadData() {
            const { data, error } = await _supabase
                .from('BDCElhuyar')
                .select('*');

            if (error) {
                console.error('Erreur lors du chargement des données:', error);
                return;
            }

            // Quantité totale de chaque produit du catalogue
            const ordersBody = document.getElementById('ordersBody');
            let totalQty = 0;
            PRODUITS.forEach(p => {
                const qty = data.reduce((sum, item) => sum + (item[p.code + '_quantity'] || 0), 0);
                totalQty += qty;
                const row = document.createElement('tr');
                row.innerHTML = `<td></td><td></td><td class="amount">${qty}</td><td class="amount">${euros.format(qty * p.prix)}</td>`;
                row.cells[0].textContent = p.code;
                row.cells[1].textContent = p.nom;
                ordersBody.appendChild(row);
            });

            const totalAmount = data.reduce((sum, item) => sum + (Number(item.total_amount) || 0), 0);
            document.getElementById('totalQty').textContent = totalQty;
            document.getElementById('totalAmount').textContent = euros.format(totalAmount);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
        });
    </script>
</body>
</html>
