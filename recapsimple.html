<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récapitulatif des commandes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a href="admin.html" class="btn">← Retour</a>
        <h1>Récapitulatif des commandes</h1>
        <button type="button" class="btn" onclick="location.reload();">↻ Rafraîchir</button>
    </header>

    <main class="page page-full">
        <div class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr id="headRow">
                        <th>Order ID <input type="text" id="searchId" oninput="filterTable()"></th>
                        <th>Nom du Vendeur <input type="text" id="searchVendor" oninput="filterTable()"></th>
                        <th>Nom du Client <input type="text" id="searchClient" oninput="filterTable()"></th>
                        <!-- Colonnes produits générées depuis produits.js -->
                        <th>Méthode de Paiement</th>
                        <th>Numéro de Chèque</th>
                        <th>Montant Total</th>
                        <th>Date de Création</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <!-- Les données seront insérées ici par JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="produits.js"></script>
    <script>
        const { createClient } = supabase
        const _supabase = createClient('https://pjbhjhjmcxyiapzlqdpo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqYmhqaGptY3h5aWFwemxxZHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA0NjY3MzUsImV4cCI6MjA0NjA0MjczNX0.p1nDmQ2mIpJRVZAaZIOT0db4MQZJV6V0TRILpoJ3UOs')
        const PREMIERE_COLONNE_PRODUIT = 3;
        let filtreProduit = null; // index de la colonne produit filtrée, ou null

        // En-têtes des colonnes produits
        const paymentHeader = document.querySelector('#headRow th:nth-child(4)');
        PRODUITS.forEach((p, i) => {
            const th = document.createElement('th');
            th.title = p.nom;
            th.innerHTML = `${p.code} <button type="button" class="btn btn-sm" onclick="filterNonZero(${PREMIERE_COLONNE_PRODUIT + i}, this)">Voir</button>`;
            paymentHeader.before(th);
        });

        const formatDate = value => value ? new Date(value).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '';

        async function loadData() {
            const { data, error } = await _supabase
                .from('BDCElhuyar')
                .select('*')
                .order('order_id', { ascending: true });

            if (error) {
                console.error('Erreur lors du chargement des données:', error);
                return;
            }

            const ordersBody = document.getElementById('ordersBody');
            ordersBody.innerHTML = '';
            data.forEach(item => {
                const cells = [
                    item.order_id,
                    item.vendor_name,
                    item.client_name,
                    ...PRODUITS.map(p => item[p.code + '_quantity'] || 0),
                    item.payment_method === 'cheque' ? 'Chèque' : 'Espèces',
                    item.cheque_number || '',
                    Number(item.total_amount).toFixed(2),
                    isNaN(new Date(item.creation_date)) ? (item.creation_date || '') : formatDate(item.creation_date),
                ];
                const row = document.createElement('tr');
                cells.forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value ?? '';
                    row.appendChild(td);
                });
                ordersBody.appendChild(row);
            });
        }

        loadData();

        // Bouton « Voir » : n'affiche que les commandes contenant ce produit (re-cliquer pour tout afficher)
        function filterNonZero(columnIndex, button) {
            filtreProduit = filtreProduit === columnIndex ? null : columnIndex;
            document.querySelectorAll('#headRow .btn-sm').forEach(b => b.classList.toggle('active', b === button && filtreProduit !== null));
            filterTable();
        }

        function filterTable() {
            const searchId = document.getElementById('searchId').value.toLowerCase();
            const searchVendor = document.getElementById('searchVendor').value.toLowerCase();
            const searchClient = document.getElementById('searchClient').value.toLowerCase();
            const rows = document.getElementById('ordersBody').rows;

            for (const row of rows) {
                const cells = row.cells;
                const visible =
                    cells[0].textContent.toLowerCase().includes(searchId) &&
                    cells[1].textContent.toLowerCase().includes(searchVendor) &&
                    cells[2].textContent.toLowerCase().includes(searchClient) &&
                    (filtreProduit === null || (parseInt(cells[filtreProduit].textContent) || 0) > 0);
                row.style.display = visible ? '' : 'none';
            }
        }
    </script>
</body>
</html>
